app = "meme-video-labeler"
primary_region = "iad"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  LABELMEME_DATA_DIR = "/data"

[mounts]
  source = "labelmeme_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
