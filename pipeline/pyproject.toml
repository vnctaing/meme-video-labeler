[project]
name = "labelmeme-pipeline"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "edgetam @ git+https://github.com/facebookresearch/EdgeTAM@7711e012a30a2402c4eaab637bdb00a521302c91",
  "timm==1.0.30",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "certifi==2026.10.18",
  "numpy==2.5.4",
  "opencv-python==5.0.0.93",
  "fastapi==0.150.0",
  "uvicorn==0.54.0",
  "yt-dlp[default]==2026.8.19",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.2"]

[tool.uv.extra-build-dependencies]
edgetam = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.dependency-metadata]]
name = "edgetam"
version = "1.0"
requires-dist = ["torch>=2.3.1", "torchvision>=0.18.1", "numpy>=1.24.4", "tqdm>=4.66.1", "hydra-core>=1.3.2", "iopath>=0.1.10", "pillow>=9.4.0"]

[tool.uv.extra-build-variables]
edgetam = { SAM2_BUILD_CUDA = "0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
